<!DOCTYPE html>
<html lang="pt-BR">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orçamentos</title>

    <link rel="manifest" href="../manifest.json">

    <meta name="theme-color" content="#4F46E5">

    <link rel="apple-touch-icon" href="../img/icons/icon-192.png">

    <link rel="icon" href="../img/icons/icon-192.png">

    <link rel="stylesheet" href="../css/orcamentos.css">

    <link rel="stylesheet" href="../css/nav-lateral.css">

</head>

<body>

<header class="header">

    <button class="voltar" onclick="window.location.href='dashboard.html'">←</button>

    <div class="header-texto">

        <h1>📊 Orçamentos</h1>

        <p>Defina limites de gasto por categoria</p>

    </div>

</header>

<main class="container">

    <!-- Novo orçamento -->
    <section class="card-form">

        <h2>Novo orçamento</h2>

        <form id="formOrcamento">

            <div class="campo">
                <label>Categoria</label>
                <select id="categoriaOrcamento" required>
                    <option value="">Selecione</option>
                </select>
            </div>

            <div class="campo">
                <label>Limite (R$)</label>
                <input type="number" id="limiteOrcamento" step="0.01" min="0.01" placeholder="0,00" required>
            </div>

            <div class="campo-linha">

                <div class="campo">
                    <label>De</label>
                    <input type="date" id="dataInicioOrcamento" required>
                </div>

                <div class="campo">
                    <label>Até</label>
                    <input type="date" id="dataFimOrcamento" required>
                </div>

            </div>

            <p class="orcamento-dica">
                Defina o período em que esse limite vale — por exemplo, do dia 1 até o dia 30 deste mês, ou só até uma data específica.
            </p>

            <button type="submit" class="btnSalvar">
                💾 Criar orçamento
            </button>

        </form>

    </section>

    <!-- Lista de orçamentos -->
    <section class="titulo">
        <h2>Seus orçamentos</h2>
    </section>

    <section class="orcamentos" id="listaOrcamentos">
        <!-- Orçamentos aparecerão aqui -->
    </section>

</main>

<script type="module" src="../js/orcamentos.js"></script>

<script src="../js/pwa.js"></script>

<script src="../js/nav-lateral.js"></script>

</body>

</html>
