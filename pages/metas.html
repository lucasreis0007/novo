<!DOCTYPE html>
<html lang="pt-BR">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metas</title>

    <link rel="manifest" href="../manifest.json">

    <meta name="theme-color" content="#4F46E5">

    <link rel="apple-touch-icon" href="../img/icons/icon-192.png">

    <link rel="icon" href="../img/icons/icon-192.png">

    <link rel="stylesheet" href="../css/metas.css">

    <link rel="stylesheet" href="../css/nav-lateral.css">

</head>

<body>

<header class="header">

    <button class="voltar" onclick="window.location.href='dashboard.html'">←</button>

    <div class="header-texto">

        <h1>🎯 Metas</h1>

        <p>Acompanhe seus objetivos financeiros</p>

    </div>

</header>

<main class="container">

    <!-- Nova meta -->
    <section class="card-form">

        <h2>Nova meta</h2>

        <form id="formMeta">

            <div class="campo">
                <label>Ícone</label>
                <select id="emoji">
                    <option value="🎯">🎯 Geral</option>
                    <option value="🚗">🚗 Carro / CNH</option>
                    <option value="🏠">🏠 Casa</option>
                    <option value="✈️">✈️ Viagem</option>
                    <option value="🛡️">🛡️ Reserva de emergência</option>
                    <option value="📱">📱 Eletrônico</option>
                    <option value="🎓">🎓 Estudos</option>
                </select>
            </div>

            <div class="campo">
                <label>Nome da meta</label>
                <input type="text" id="nomeMeta" placeholder="Ex: Reserva de emergência" required>
            </div>

            <div class="campo">
                <label>Valor objetivo (R$)</label>
                <input type="number" id="valorObjetivo" step="0.01" min="0.01" placeholder="0,00" required>
            </div>

            <div class="campo">
                <label>Valor já guardado (R$)</label>
                <input type="number" id="valorAtual" step="0.01" min="0" placeholder="0,00">
            </div>

            <button type="submit" id="btnSalvarMeta" class="btnSalvar">
                💾 Criar meta
            </button>

            <button type="button" id="btnCancelarEdicaoMeta" class="btnCancelar" style="display:none;">
                Cancelar edição
            </button>

        </form>

    </section>

    <!-- Lista de metas -->
    <section class="titulo">
        <h2>Suas metas</h2>
    </section>

    <section class="metas" id="listaMetas">
        <!-- Metas aparecerão aqui -->
    </section>

</main>

<script type="module" src="../js/metas.js"></script>

<script src="../js/pwa.js"></script>

<script src="../js/nav-lateral.js"></script>

</body>

</html>
