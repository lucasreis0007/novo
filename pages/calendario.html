<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendário</title>

    <link rel="manifest" href="../manifest.json">

    <meta name="theme-color" content="#4F46E5">

    <link rel="apple-touch-icon" href="../img/icons/icon-192.png">

    <link rel="icon" href="../img/icons/icon-192.png">

    <link rel="stylesheet" href="../css/calendario.css">

    <link rel="stylesheet" href="../css/nav-lateral.css">

</head>

<body>

<header class="header">

    <button class="voltar" onclick="window.location.href='dashboard.html'">←</button>

    <div class="header-texto">
        <h1>🗓️ Calendário</h1>
        <p>Agende e organize suas movimentações por data</p>
    </div>

</header>

<main class="container">

    <!-- Navegação de mês -->
    <section class="seletor-mes">

        <button type="button" id="mesAnterior" class="nav-mes" aria-label="Mês anterior">‹</button>

        <button type="button" id="botaoHoje" class="titulo-mes">
            <span id="tituloMes">Agosto 2026</span>
        </button>

        <button type="button" id="mesProximo" class="nav-mes" aria-label="Próximo mês">›</button>

    </section>

    <!-- Resumo do mês -->
    <section class="resumo-mes">

        <div class="resumo-item entrada">
            <span>Entradas</span>
            <strong id="totalEntradasMes">R$ 0,00</strong>
        </div>

        <div class="resumo-item despesa">
            <span>Saídas</span>
            <strong id="totalSaidasMes">R$ 0,00</strong>
        </div>

    </section>

    <!-- Grade do calendário -->
    <section class="calendario">

        <div class="dias-semana">
            <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
        </div>

        <div id="gradeCalendario" class="grade-calendario">
            <!-- Dias gerados via JS -->
        </div>

    </section>

    <!-- Dia selecionado -->
    <section class="dia-selecionado">

        <div class="dia-selecionado-cabecalho">
            <h2 id="tituloDiaSelecionado">Hoje</h2>
            <button type="button" id="btnAdicionarDia" class="btnAdicionarDia">+ Adicionar</button>
        </div>

        <div id="listaDia">
            <!-- Movimentações do dia selecionado -->
        </div>

    </section>

</main>

<script type="module" src="../js/calendario.js"></script>

<script src="../js/pwa.js"></script>

<script src="../js/nav-lateral.js"></script>

</body>

</html>
