<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <link rel="apple-touch-icon" href="img/icons/icon-192.png">
    <link rel="icon" href="img/icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Finanças</h1>

        <!-- Tela de LOGIN (aparece quando já existe usuário cadastrado) -->
        <form id="formLogin" class="tela oculto">

            <p>Entre com seu usuário e senha.</p>

            <input type="text" id="loginUsuario" placeholder="Usuário" autocomplete="username" required>
            <input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password" required>

            <p class="erro" id="erroLogin"></p>

            <button type="submit">Entrar</button>

            <a href="#" id="linkResetar" class="link-secundario">Esqueci minha senha / trocar de conta</a>

        </form>

        <!-- Tela de CADASTRO (aparece na primeira vez que o app é aberto) -->
        <form id="formCadastro" class="tela oculto">

            <p>Crie um usuário e senha para proteger seus dados.</p>

            <input type="text" id="cadUsuario" placeholder="Usuário" autocomplete="username" required>
            <input type="password" id="cadSenha" placeholder="Senha" autocomplete="new-password" required minlength="4">
            <input type="password" id="cadConfirmar" placeholder="Confirmar senha" autocomplete="new-password" required minlength="4">

            <p class="erro" id="erroCadastro"></p>

            <button type="submit">Criar conta</button>

        </form>

    </div>

    <script src="js/script.js"></script>
    <script src="js/pwa.js"></script>

</body>
</html>
