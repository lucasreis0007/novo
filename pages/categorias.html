<!DOCTYPE html>
<html lang="pt-BR">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categorias</title>

    <link rel="manifest" href="../manifest.json">

    <meta name="theme-color" content="#4F46E5">

    <link rel="apple-touch-icon" href="../img/icons/icon-192.png">

    <link rel="icon" href="../img/icons/icon-192.png">

    <link rel="stylesheet" href="../css/categorias.css">

</head>

<body>

<header class="header">

    <button class="voltar" onclick="window.location.href='dashboard.html'">←</button>

    <div class="header-texto">

        <h1>🏷️ Categorias</h1>

        <p>Organize suas entradas e saídas</p>

    </div>

</header>

<main class="container">

    <!-- Abas -->
    <div class="abas">
        <button class="aba ativa" id="abaSaida" data-tipo="saida">Saída</button>
        <button class="aba" id="abaEntrada" data-tipo="entrada">Entrada</button>
    </div>

    <!-- Nova categoria -->
    <section class="card-form">

        <h2 id="tituloForm">Nova categoria de saída</h2>

        <form id="formCategoria">

            <div class="campo">
                <label>Nome da categoria</label>
                <input type="text" id="nomeCategoria" placeholder="Ex: Farmácia" required>
            </div>

            <div class="campo" id="campoNatureza">
                <label>Tipo de gasto</label>
                <select id="natureza">
                    <option value="Despesa">💸 Despesa (gasto do dia a dia)</option>
                    <option value="Reserva">🛡️ Reserva (guardar dinheiro)</option>
                    <option value="Investimento">📈 Investimento</option>
                    <option value="Resgate">🏧 Resgate (retirar da reserva)</option>
                </select>
            </div>

            <button type="submit" class="btnSalvar">
                💾 Adicionar categoria
            </button>

        </form>

    </section>

    <!-- Lista de categorias -->
    <section class="titulo">
        <h2 id="tituloLista">Categorias de saída</h2>
    </section>

    <section class="categorias" id="listaCategorias">
        <!-- Categorias aparecerão aqui -->
    </section>

</main>

<nav class="bottom-nav">

    <a href="dashboard.html">
        <span>🏠</span>
        <small>Início</small>
    </a>

    <a href="historico.html">
        <span>📜</span>
        <small>Histórico</small>
    </a>

    <a href="adicionar.html" class="botao-centro">
        +
    </a>

    <a href="metas.html">
        <span>🎯</span>
        <small>Metas</small>
    </a>

    <a href="bancos.html">
        <span>🏦</span>
        <small>Bancos</small>
    </a>

</nav>

<script type="module" src="../js/categorias.js"></script>

<script src="../js/pwa.js"></script>

</body>

</html>
