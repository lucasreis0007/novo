<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <script src="../js/utils.js"></script>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bancos</title>

    <link rel="manifest" href="../manifest.json">

    <meta name="theme-color" content="#4F46E5">

    <link rel="apple-touch-icon" href="../img/icons/icon-192.png">

    <link rel="icon" href="../img/icons/icon-192.png">

    <link rel="stylesheet" href="../css/bancos.css">

</head>

<body>

<header class="header">

    <button class="voltar" onclick="window.location.href='dashboard.html'">←</button>

    <div class="header-texto">

        <h1>🏦 Bancos</h1>

        <p>Suas contas e carteiras</p>

    </div>

</header>

<main class="container">

    <!-- Novo banco -->
    <section class="card-form">

        <h2>Nova conta</h2>

        <form id="formBanco">

            <div class="campo">
                <label>Ícone</label>
                <select id="emoji">
                    <option value="🟣">🟣 Roxo</option>
                    <option value="🟠">🟠 Laranja</option>
                    <option value="⚫">⚫ Preto</option>
                    <option value="🟢">🟢 Verde</option>
                    <option value="🔵">🔵 Azul</option>
                    <option value="🩷">🩷 Rosa</option>
                    <option value="🔴">🔴 Vermelho</option>
                    <option value="🟡">🟡 Amarelo</option>
                </select>
            </div>

            <div class="campo">
                <label>Nome do banco / conta</label>
                <input type="text" id="nomeBanco" placeholder="Ex: PicPay" required>
            </div>

            <div class="campo">
                <label>Cor do cartão</label>
                <select id="cor">
                    <option value="0">Roxo</option>
                    <option value="1">Laranja</option>
                    <option value="2">Preto</option>
                    <option value="3">Verde</option>
                    <option value="4">Azul</option>
                    <option value="5">Rosa</option>
                    <option value="6">Vermelho</option>
                    <option value="7">Amarelo</option>
                </select>
            </div>

            <button type="submit" class="btnSalvar">
                💾 Adicionar conta
            </button>

        </form>

    </section>

    <!-- Lista de bancos -->
    <section class="titulo">
        <h2>Suas contas</h2>
    </section>

    <section class="contas" id="listaBancos">
        <!-- Bancos aparecerão aqui -->
    </section>

</main>

<nav class="bottom-nav">

    <a href="dashboard.html">
        <span>🏠</span>
        <small>Início</small>
    </a>

    <a href="historico.html">
        <span>📜</span>
        <small>Histórico</small>
    </a>

    <a href="adicionar.html" class="botao-centro">
        +
    </a>

    <a href="metas.html">
        <span>🎯</span>
        <small>Metas</small>
    </a>

    <a href="bancos.html" class="active">
        <span>🏦</span>
        <small>Bancos</small>
    </a>

</nav>

<script src="../js/bancos.js"></script>

<script src="../js/pwa.js"></script>

</body>

</html>
