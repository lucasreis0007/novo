<!DOCTYPE html>
<html lang="pt-BR">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico</title>

    <link rel="manifest" href="../manifest.json">

    <meta name="theme-color" content="#4F46E5">

    <link rel="apple-touch-icon" href="../img/icons/icon-192.png">

    <link rel="icon" href="../img/icons/icon-192.png">

    <link rel="stylesheet" href="../css/historico.css">

    <link rel="stylesheet" href="../css/nav-lateral.css">

</head>

<body>

<header class="header">

    <button class="voltar" onclick="window.location.href='dashboard.html'">←</button>

    <div class="header-texto">
        <h1>📜 Histórico</h1>
        <p>Veja todas as suas movimentações</p>
    </div>

</header>

<main class="container">

    <section class="filtros">

        <input
            type="text"
            id="pesquisa"
            placeholder="🔎 Pesquisar movimentação..."
        >

        <select id="filtroBanco">

            <option value="">Todos os bancos</option>

        </select>

        <select id="filtroTipo">

            <option value="">Todos os tipos</option>

            <option>Entrada</option>

            <option>Saída</option>

            <option>Rendimento</option>

        </select>

        <select id="filtroCategoria">

            <option value="">Todas as categorias</option>

        </select>

    </section>

    <section id="listaMovimentacoes">

        <!-- As movimentações aparecerão aqui -->

    </section>

    <section class="acoes">

        <button id="voltarDashboard">

            ⬅️ Voltar ao Dashboard

        </button>

    </section>

</main>

<script type="module" src="../js/historico.js"></script>

<script src="../js/pwa.js"></script>

<script src="../js/nav-lateral.js"></script>

</body>

</html>
